<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Swiper demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
  <!-- Link Swiper's CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <!-- Demo styles -->
  <style>
    html,
    body {
      position: relative;
      height: 60%;
    }

    body {
      background: #000;
      font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #fff;
      margin: 0;
      padding: 0;
    }

    .swiper {
      width: 100%;
      height: 100%;
      margin-top: 250px;
    }
    .swiper-slide {
      text-align: center;
      font-size: 18px;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .swiper-slide img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius:20px;
      justify-content: center;
      transform: scale(1);
      transition: all 0.3s ease;
      filter: brightness(30%);
      
    } 
    .text{
        position: absolute;
        bottom: 8px;
        font-size:35px;
    }
    .swiper-slide img:hover{
         transform: scale(1.1);
    }
    </style>
</head>

<body>
  <!-- Swiper -->
  <div class="swiper mySwiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide"><img src="https://media.tenor.com/1LYzym8AwPIAAAAM/frog-meme.gif" alt="">
        <div class="text">ACUMALAKA</div>
    </div>
      <div class="swiper-slide"><img src="https://media.tenor.com/1LYzym8AwPIAAAAM/frog-meme.gif" alt="">
        <div class="text">ACUMALAKA</div>
    </div>
      <div class="swiper-slide"><img src="https://media.tenor.com/1LYzym8AwPIAAAAM/frog-meme.gif" alt="">
         <div class="text">ACUMALAKA</div>
    </div>
      <div class="swiper-slide"><img src="https://media.tenor.com/1LYzym8AwPIAAAAM/frog-meme.gif" alt="">
         <div class="text">ACUMALAKA</div>
    </div>
      <div class="swiper-slide"><img src="https://media.tenor.com/1LYzym8AwPIAAAAM/frog-meme.gif" alt="">
         <div class="text">ACUMALAKA</div>   
    </div>
    </div>
    <div class="swiper-pagination"></div>
  </div>

  <!-- Swiper JS -->
 <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>


  <!-- Initialize Swiper -->
   <script>
    var swiper = new Swiper(".mySwiper", {
      slidesPerView: 3,
      spaceBetween: 30,
      pagination: {
        el: ".swiper-pagination",
        clickable: true,
      },
    });
  </script>
</body>

</html>
