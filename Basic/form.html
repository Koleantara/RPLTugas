<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: lightcyan;
        }
        *{
            box-sizing: border-box;
        }
        .container{
            width: 80%;
            padding: 20px;
            border: 10px;
            margin: auto;
            background-color: lightblue;
        }
        input[type="text"],select,textarea{
            width: 100%;
            padding: 12px;
            border: 5px solid rgb(74, 193, 233);
            border-radius: 10px;
            box-sizing: border-box;
            margin-top: 6px;
            margin-bottom: 16px;
        }
        input[type=submit]{
            background-color: #04aa6d;
            color: white;
            border-radius: 5px;
            border-style: none;
            padding: 10px 20px;
        }
        input[type=submit]:hover{
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>Contact Form</h3>
        <form action="">
            <table for="Nama_Lengkap">Your Name</table>
            <input type="text"  
            id="Nama_Lengkap"
            name="Nama_Lengkap" 
            placeholder="Fill Your Name......">
            <table for="Negara">Country</table>
            <select name="Negara" id="negara">
                <option value="Amerika">Amerika</option>
                <option value="Canada">Canada</option>
                <option value="Indonesia">Indonesia</option>
                <option value="China">China</option>
                <option value="Japan">Japan</option>
                <option value="Brazil">Brazil</option>
                <option value="Malaysia">Malaysia</option>
                <option value="England">England</option>
                <option value="Spanyol">Spanyol</option>
                <option value="Belanda">Belanda</option>
                <option value="Swedia">Swedia</option>
                <option value="New_Zealand">New Zealand</option>
                <option value="Australia">Australia</option>
                <option value="Vietnam">Vietnam</option>
                <option value="Philipine">Philipine</option>
                <option value="German">German</option>
            </select>
            <table for="Subject"Subject>
                <textarea 
                name="Subject" 
                id="Subject" 
                placeholder=" Write something...." 
                style="height: 200px;"></textarea>
            </table>
            <input type="radio" name="City" id="City">
            <table for="City">Jakarta</table>
            <input type="radio" name="City" id="City">
            <table for="City">Bogor</table>
            <input type="checkbox" name="smp" id="smp">
            <table for="smp">SMP</table>
            <input type="checkbox" name="sma" id="sma">
            <table for="smp">SMA</table>
            <input type="checkbox" name="smk" id="smk">
            <table for="smp">SMk</table>


            <input type="submit" value="submit">
        </form>
    </div>
</body>
</html>
